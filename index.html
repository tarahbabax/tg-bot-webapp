<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="hero">
        <div class="hero__glow"></div>
    </div>

    <div class="profile">
        <div class="avatar" id="avatar"></div>

        <div class="tag-row">
            <p class="tag-row__tag" id="userTag">@юзертег</p>
            <svg id="premiumStar" class="premium-star" viewBox="0 0 24 24" style="display:none;">
                <defs>
                    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#FFD469" />
                        <stop offset="100%" stop-color="#FF9A45" />
                    </linearGradient>
                </defs>
                <path fill="url(#starGradient)" d="M12 2.5l2.6 5.66 6.15.68-4.6 4.24 1.28 6.1L12 16.9l-5.43 2.28 1.28-6.1-4.6-4.24 6.15-.68z"/>
            </svg>
        </div>

        <p class="profile__name" id="userName">Ім'я</p>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
