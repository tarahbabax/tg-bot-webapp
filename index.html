<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent: #FF5A45;
            --ink: #14131A;
            --avatar-bg: #14131A;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 28px 20px 24px;
        }

        .header__tag {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.01em;
            color: var(--accent);
        }

        .premium-star {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 0 20px;
        }

        .avatar {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: var(--avatar-bg);
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .profile__name {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.35;
            color: var(--accent);
            text-align: center;
            flex: 1;
        }
    </style>
</head>
<body>
    <div class="header">
        <p class="header__tag" id="userTag">@юзертег</p>
        <svg id="premiumStar" class="premium-star" viewBox="0 0 24 24" style="display:none;">
            <defs>
                <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFD469" />
                    <stop offset="100%" stop-color="#FF9A45" />
                </linearGradient>
            </defs>
            <path fill="url(#starGradient)" d="M12 2.5l2.6 5.66 6.15.68-4.6 4.24 1.28 6.1L12 16.9l-5.43 2.28 1.28-6.1-4.6-4.24 6.15-.68z"/>
        </svg>
    </div>

    <div class="profile">
        <div class="avatar" id="avatar"></div>
        <p class="profile__name" id="userName">Ім'я яке записане в тг людини</p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        const tagEl = document.getElementById("userTag");
        const nameEl = document.getElementById("userName");
        const avatarEl = document.getElementById("avatar");
        const starEl = document.getElementById("premiumStar");

        if (user) {
            tagEl.textContent = user.username ? "@" + user.username : "без юзертегу";
            nameEl.textContent = [user.first_name, user.last_name].filter(Boolean).join(" ");

            if (user.photo_url) {
                avatarEl.style.backgroundImage = `url(${user.photo_url})`;
            }

            if (user.is_premium) {
                starEl.style.display = "block";
            }
        }
    </script>
</body>
</html>
