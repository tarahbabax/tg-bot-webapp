<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Manage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <div class="page">

        <header class="topbar">
            <button class="icon-btn" type="button" aria-label="Налаштування">
                <span class="icon-btn__emoji">⚙️</span>
            </button>

            <p class="topbar__label">
                <span id="userNameTop">Ім'я</span>
                <span class="topbar__divider">|</span>
                <span class="topbar__bot">VLKManageBot</span>
            </p>
        </header>

        <div class="viewport">
            <div class="screens" id="screens">

                <section class="screen" id="screen-profile">
                    <div class="profile">
                        <div class="avatar" id="avatar"></div>

                        <div class="tag-row">
                            <p class="tag-row__tag" id="userTag">@юзертег</p>
                            <span id="premiumStar" class="premium-star" style="display:none;">⭐</span>
                        </div>
                    </div>
                </section>

                <section class="screen" id="screen-chats">
                    <div class="empty-state">
                        <span class="empty-state__emoji">💬</span>
                        <p class="empty-state__title">Чатів поки немає</p>
                        <p class="empty-state__text">Тут з'являться твої чати</p>
                    </div>
                </section>

                <section class="screen" id="screen-servers">
                    <div class="empty-state">
                        <span class="empty-state__emoji">🖥️</span>
                        <p class="empty-state__title">Серверів поки немає</p>
                        <p class="empty-state__text">Тут з'являться твої сервери</p>
                    </div>
                </section>

            </div>
        </div>

        <nav class="tabbar" id="tabbar">
            <button class="tabbar__item tabbar__item--active" type="button" data-index="0">
                <span class="tabbar__emoji">👤</span>
                <span>Профіль</span>
            </button>

            <button class="tabbar__item" type="button" data-index="1">
                <span class="tabbar__emoji">💬</span>
                <span>Чати</span>
            </button>

            <button class="tabbar__item" type="button" data-index="2">
                <span class="tabbar__emoji">🖥️</span>
                <span>Сервери</span>
            </button>
        </nav>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
